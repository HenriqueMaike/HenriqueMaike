# Salve este arquivo em: .github/workflows/update-profile.yml
# (dentro do repositório HenriqueMaike/HenriqueMaike)
#
# O que ele faz:
#  1. Lista TODOS os seus repositórios públicos (sem forks) e reescreve
#     os cards entre <!-- REPOS:START --> e <!-- REPOS:END --> no README.
#  2. Gera a animação da cobrinha a partir das SUAS contribuições.
# Roda todo dia, a cada push na main, e manualmente pela aba Actions.

name: Atualizar perfil

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions:
  contents: write

jobs:
  repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cards de todos os repositórios
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const user = context.repo.owner;
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: user, type: "owner", per_page: 100,
            });

            const list = repos
              .filter(r => !r.fork && !r.private && !r.archived && r.name !== user)
              .sort((a, b) =>
                (b.stargazers_count - a.stargazers_count) ||
                (new Date(b.pushed_at) - new Date(a.pushed_at)));

            const style = "hide_border=true&bg_color=0d1117&title_color=00f2ff&icon_color=a855f7&text_color=c9d1d9";
            const cards = list.map(r =>
              `  <a href="${r.html_url}"><img width="49%" src="https://github-readme-stats.vercel.app/api/pin/?username=${user}&repo=${encodeURIComponent(r.name)}&${style}" /></a>`
            ).join("\n");

            const block = `<!-- REPOS:START -->\n<p align="center">\n${cards}\n</p>\n<!-- REPOS:END -->`;
            const readme = fs.readFileSync("README.md", "utf8");
            const updated = readme.replace(/<!-- REPOS:START -->[\s\S]*<!-- REPOS:END -->/, block);
            fs.writeFileSync("README.md", updated);
            core.info(`${list.length} repositórios escritos no README.`);

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: atualiza cards dos repositórios"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f2ff&color_dots=#161b22,#3b0a7a,#5a12b5,#6e00ff,#00f2ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
